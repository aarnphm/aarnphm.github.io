<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>12 days of existentialism</title>
    <meta
      name="description"
      content="Twelve existentialist ideas, one per day, with a primary source for each."
    />
    <script>
      // Follow the garden's stored theme; 'system' and 'daylight' fall back to the OS preference here.
      ;(() => {
        let preference = null
        try {
          preference = localStorage.getItem('theme-preference') ?? localStorage.getItem('theme')
        } catch {}
        const theme =
          preference === 'light' || preference === 'dark'
            ? preference
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('saved-theme', theme)
      })()
    </script>
    <style>
      @font-face {
        font-family: 'Space Groteskque';
        src: url('/static/SpaceGrotesk-VariableFont_wght.ttf') format('truetype');
        font-display: swap;
      }
      @font-face {
        font-family: 'PP Neue Montreal';
        src: url('/fonts/PPNeueMontreal-Regular.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'PP Neue Montreal';
        src: url('/fonts/PPNeueMontreal-Italic.woff2') format('woff2');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'PP Neue Montreal';
        src: url('/fonts/PPNeueMontreal-Medium.woff2') format('woff2');
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: 'Berkeley Mono';
        src: url('/fonts/TX-02-Regular.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }

      :root {
        --light: #fffcf0;
        --lightgray: #e6e4d9;
        --gray: #b7b5ac;
        --darkgray: #6f6e69;
        --dark: #100f0f;
        --secondary: #cdd597;

        --titleFont: 'Space Groteskque', system-ui, sans-serif;
        --bodyFont: 'PP Neue Montreal', system-ui, sans-serif;
        --codeFont: 'Berkeley Mono', ui-monospace, monospace;

        --text-ui: 0.875rem;
        --text-meta: 0.75rem;

        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-6: 1.5rem;
        --space-8: 2rem;
        --space-12: 3rem;

        --advent-line: color-mix(in srgb, var(--gray) 55%, transparent);
        --advent-surface: color-mix(in srgb, var(--light) 86%, var(--lightgray));
        --advent-selected: color-mix(in srgb, var(--secondary) 18%, var(--advent-surface));
        --advent-control-height: 1.75rem;

        color-scheme: light;
      }

      :root[saved-theme='dark'] {
        --light: #100f0f;
        --lightgray: #282726;
        --gray: #575653;
        --darkgray: #878580;
        --dark: #cecdc3;

        color-scheme: dark;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: var(--space-12) 18px;
        background: var(--light);
        color: var(--darkgray);
        font: 1rem / 1.5 var(--bodyFont);
      }

      main {
        max-width: 52rem;
        margin: 0 auto;
      }

      a,
      button {
        color: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--dark);
        outline-offset: 2px;
      }

      .home {
        font: var(--text-meta) / 1.4 var(--codeFont);
        color: var(--darkgray);
        text-underline-offset: 0.2em;
      }

      header {
        margin-block: var(--space-8) var(--space-8);
        max-width: 38rem;
      }

      h1,
      h2 {
        margin: 0;
        color: var(--dark);
        font-family: var(--titleFont);
        font-weight: 400;
        line-height: 1.1;
        text-wrap: balance;
      }

      h1 {
        font-size: 2.6rem;
      }

      .lede {
        margin: var(--space-3) 0 0;
      }

      .epigraph {
        margin: var(--space-6) 0 0;
      }

      .epigraph blockquote {
        margin: 0;
      }

      .epigraph p {
        margin: 0;
        color: var(--dark);
        font-style: italic;
      }

      .source {
        display: block;
        margin-top: var(--space-1);
        font: var(--text-meta) / 1.4 var(--codeFont);
        font-style: normal;
        color: var(--darkgray);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-2);
        margin-bottom: var(--space-3);
        font: var(--text-meta) / 1.4 var(--codeFont);
        font-variant-numeric: tabular-nums;
      }

      .toolbar button {
        min-block-size: var(--advent-control-height);
        padding-inline: var(--space-3);
        background: transparent;
        border: 1px solid var(--advent-line);
        border-radius: 0;
        font: inherit;
        cursor: pointer;
        touch-action: manipulation;
      }

      .toolbar button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .calendar-frame {
        container-type: inline-size;
      }

      .calendar {
        --columns: 1;

        display: grid;
        grid-template-columns: repeat(var(--columns), minmax(0, 1fr));
        gap: 1px;
        margin: 0;
        padding: 0;
        list-style: none;
        background: var(--advent-line);
        border: 1px solid var(--advent-line);
      }

      .calendar li {
        display: flex;
      }

      @container (min-width: 26rem) {
        .calendar {
          --columns: 2;
        }
      }

      @container (min-width: 38rem) {
        .calendar {
          --columns: 3;
        }
      }

      @container (min-width: 48rem) {
        .calendar {
          --columns: 4;
        }
      }

      .day {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: var(--space-4);
        inline-size: 100%;
        min-block-size: 8rem;
        padding: var(--space-3);
        background: var(--light);
        border: 0;
        border-radius: 0;
        color: var(--darkgray);
        font: var(--text-ui) / 1.45 var(--bodyFont);
        text-align: start;
        cursor: pointer;
        transition: background-color 120ms ease;
      }

      .day:focus-visible {
        outline-offset: -2px;
      }

      .day-number {
        font-family: var(--codeFont);
        font-size: var(--text-meta);
        font-variant-numeric: tabular-nums;
      }

      .day-title {
        display: block;
        color: var(--dark);
        font-family: var(--titleFont);
        font-size: 1.125rem;
        line-height: 1.2;
      }

      .day-thinker {
        display: block;
        margin-top: var(--space-1);
        font-size: var(--text-meta);
      }

      .day[data-opened='true'] {
        background: var(--advent-selected);
      }

      @media (hover: hover) and (pointer: fine) {
        .day:hover,
        .toolbar button:hover:enabled,
        .close:hover {
          background: var(--advent-surface);
        }

        .day[data-opened='true']:hover {
          background: color-mix(in srgb, var(--secondary) 28%, var(--advent-surface));
        }
      }

      dialog {
        inline-size: min(40rem, calc(100% - 36px));
        max-block-size: min(85dvh, 48rem);
        overflow-y: auto;
        padding: 0;
        background: var(--light);
        color: var(--darkgray);
        border: 1px solid var(--advent-line);
        border-radius: 0;
      }

      dialog::backdrop {
        background: color-mix(in srgb, var(--light) 70%, transparent);
      }

      .dialog-bar {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-2);
        padding: var(--space-2) var(--space-3);
        background: var(--light);
        border-bottom: 1px solid var(--advent-line);
        font: var(--text-meta) / 1.4 var(--codeFont);
        font-variant-numeric: tabular-nums;
      }

      .close {
        min-block-size: var(--advent-control-height);
        padding-inline: var(--space-3);
        background: transparent;
        border: 1px solid var(--advent-line);
        border-radius: 0;
        font: inherit;
        cursor: pointer;
      }

      .entry {
        padding: var(--space-6) var(--space-6) var(--space-8);
      }

      .entry h2 {
        font-size: 1.75rem;
      }

      .entry .thinker {
        margin: var(--space-2) 0 var(--space-6);
        font-size: var(--text-ui);
      }

      .entry p {
        margin: 0;
        line-height: 1.6;
      }

      .entry p + p,
      .entry blockquote + p {
        margin-top: var(--space-4);
      }

      .entry blockquote {
        margin: var(--space-6) 0;
        padding: var(--space-4);
        background: var(--advent-surface);
      }

      .entry blockquote p {
        color: var(--dark);
        font-style: italic;
      }

      @media (max-width: 30rem) {
        .entry {
          padding-inline: var(--space-4);
        }
      }

      @media (pointer: coarse) {
        :root {
          --advent-control-height: 44px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .day {
          transition: none;
        }
      }

      @media (forced-colors: active) {
        :focus-visible {
          outline-color: Highlight;
        }

        .day[data-opened='true'] .day-title {
          text-decoration: underline;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="home" href="/">aarnphm</a>

      <header>
        <h1>12 days of existentialism</h1>
        <p class="lede">One idea per day, each with the passage it comes from.</p>
        <figure class="epigraph">
          <blockquote>
            <p>
              “Man is condemned to be free; because once thrown into the world, he is responsible
              for everything he does.”
            </p>
          </blockquote>
          <figcaption class="source">Sartre, Existentialism Is a Humanism (1946)</figcaption>
        </figure>
      </header>

      <div class="toolbar">
        <span id="progress" aria-live="polite">00 / 12 opened</span>
        <button type="button" id="reset">reset</button>
      </div>

      <div class="calendar-frame">
        <ol class="calendar" id="calendar" aria-label="days"></ol>
      </div>
    </main>

    <dialog id="entry" aria-labelledby="entry-title">
      <div class="dialog-bar">
        <span id="entry-day"></span>
        <button type="button" class="close" id="close">close</button>
      </div>
      <article class="entry">
        <h2 id="entry-title"></h2>
        <p class="thinker" id="entry-thinker"></p>
        <div id="entry-body"></div>
      </article>
    </dialog>

    <script>
      const days = [
        {
          title: 'existence precedes essence',
          thinker: 'Jean-Paul Sartre',
          body: [
            'A paper-knife exists as a concept before anyone makes it: an artisan knows what it is for. Sartre says a person has no such prior concept. You exist first, and what you are comes from what you do.',
            'Nothing fixes your purpose in advance. Each choice adds to the definition, and you make all of them.',
          ],
          quote:
            'We are left alone, without excuse. That is what I mean when I say that man is condemned to be free.',
          source: 'Existentialism Is a Humanism (1946)',
        },
        {
          title: 'the absurd',
          thinker: 'Albert Camus',
          body: [
            'People demand reasons. The world gives none. Camus calls the gap between the two the absurd; it lives in neither side alone.',
            'He examines three answers. Suicide ends the confrontation. Hope in a world beyond, the leap he calls philosophical suicide, escapes it. Revolt keeps it in view and lives anyway. He takes the third: one must imagine Sisyphus happy.',
          ],
          quote:
            'The absurd is born of this confrontation between the human need and the unreasonable silence of the world.',
          source: 'The Myth of Sisyphus (1942)',
        },
        {
          title: 'angst',
          thinker: 'Søren Kierkegaard',
          body: [
            'Fear has an object. Anxiety does not. It is the feeling of facing your own possibility: you could do anything here, and nothing stops you.',
            'Kierkegaard compares it to looking down from a height. The danger is the open space, and your ability to step into it.',
          ],
          quote: 'Anxiety is the dizziness of freedom.',
          source: 'The Concept of Anxiety (1844)',
        },
        {
          title: 'being-toward-death',
          thinker: 'Martin Heidegger',
          body: [
            'Another person can take my place in almost everything. Nobody can die my death for me. Death is the one possibility that is only mine.',
            'Heidegger argues that keeping this in view pulls a life out of routine. With a limit on the time, the choices in it become your own.',
          ],
          quote: 'As soon as man comes to life, he is at once old enough to die.',
          source: 'Being and Time, §48 (1927)',
        },
        {
          title: 'bad faith',
          thinker: 'Jean-Paul Sartre',
          body: [
            'Bad faith is a lie told to yourself. One form denies your freedom: “I had no choice.” The other denies your situation: you act as if your past and body put no limits on you.',
            'Sartre’s example is a café waiter whose movements are a little too precise. He plays at being a waiter so that he can forget he chooses to be one each morning.',
          ],
          quote: 'Bad faith seeks to flee what it cannot flee, to flee what it is.',
          source: 'Being and Nothingness (1943)',
        },
        {
          title: 'the other',
          thinker: 'Jean-Paul Sartre',
          body: [
            'When someone looks at me, I become an object in their world. They see a self that I cannot see and cannot control.',
            'The line below comes from a play in which three dead people share one room for eternity. No one tortures them. They only watch and judge each other, and that is enough.',
          ],
          quote: 'Hell is other people.',
          source: 'No Exit (1944)',
        },
        {
          title: 'authenticity',
          thinker: 'Martin Heidegger',
          body: [
            'Most of the time, I do what “one” does: I read what one reads and judge as one judges. Heidegger calls this anonymous subject das Man, “the they.”',
            'Authenticity does not require that you leave the crowd. You can still do what one does, but you choose it instead of drifting into it.',
          ],
          quote: 'Everyone is the other, and no one is himself.',
          source: 'Being and Time, §27 (1927)',
        },
        {
          title: 'freedom and responsibility',
          thinker: 'Simone de Beauvoir',
          body: [
            'Freedom always exists in a situation, and other people’s freedom is part of that situation. A freedom that ignores theirs contradicts itself.',
            'De Beauvoir applied this to oppression. When society limits what a person can become, the limit is a human act, so humans can undo it.',
          ],
          quote: 'To will oneself free is also to will others free.',
          source: 'The Ethics of Ambiguity (1947)',
        },
        {
          title: 'nausea',
          thinker: 'Jean-Paul Sartre',
          body: [
            'Roquentin looks at the root of a chestnut tree in a public garden. The word “root” falls away, and only a dark, knotted mass remains, with no reason to be there.',
            'Nausea is the physical response to contingency. Things exist without necessity, and so does he.',
          ],
          quote:
            'I exist. It’s sweet, so sweet, so slow. And light: you’d think it floated all by itself.',
          source: 'Nausea (1938)',
        },
        {
          title: 'the eternal return',
          thinker: 'Friedrich Nietzsche',
          body: [
            'A demon tells you that you will live this life again, identically, an infinite number of times. Every pain and every joy will come back in the same order.',
            'Nietzsche uses the idea as a test. Would you curse the demon, or say you had never heard anything more divine?',
          ],
          quote: 'Was that life? Well then! Once more!',
          source: 'Thus Spoke Zarathustra, III (1884)',
        },
        {
          title: 'the leap of faith',
          thinker: 'Søren Kierkegaard',
          body: [
            'Reasons do not add up to a commitment. At some point you must commit without a proof, and the risk is the commitment.',
            'For Kierkegaard the leap is to faith. Each serious commitment in a life has the same structure.',
          ],
          quote: 'Life can only be understood backwards; but it must be lived forwards.',
          source: 'Journals (1843)',
        },
        {
          title: 'radical freedom',
          thinker: 'Jean-Paul Sartre',
          body: [
            'Circumstance gives the material. It does not give the response. A prisoner still chooses how to bear the prison.',
            'This removes every excuse, and it is also the only ground on which meaning can be built.',
          ],
          quote:
            'What matters is not what people make of us, but what we ourselves make of what they have made of us.',
          source: 'Saint Genet (1952)',
        },
      ]

      const STORAGE_KEY = 'existAdventRevealed'
      const calendar = document.getElementById('calendar')
      const progress = document.getElementById('progress')
      const reset = document.getElementById('reset')
      const dialog = document.getElementById('entry')
      const pad = n => String(n).padStart(2, '0')

      const readOpened = () => {
        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')
          return new Set(Array.isArray(stored) ? stored : [])
        } catch {
          return new Set()
        }
      }

      const writeOpened = opened => {
        try {
          if (opened.size === 0) localStorage.removeItem(STORAGE_KEY)
          else localStorage.setItem(STORAGE_KEY, JSON.stringify([...opened]))
        } catch {}
      }

      const opened = readOpened()

      const span = (className, text) => {
        const el = document.createElement('span')
        el.className = className
        el.textContent = text
        return el
      }

      function render() {
        calendar.replaceChildren(
          ...days.map((day, index) => {
            const isOpened = opened.has(index)
            const button = document.createElement('button')
            button.type = 'button'
            button.className = 'day'
            button.dataset.index = String(index)
            button.dataset.opened = String(isOpened)
            button.append(span('day-number', `day ${pad(index + 1)}`))

            const label = document.createElement('span')
            if (isOpened) {
              label.append(span('day-title', day.title), span('day-thinker', day.thinker))
            } else {
              label.append(span('day-thinker', 'closed'))
            }
            button.append(label)

            const item = document.createElement('li')
            item.append(button)
            return item
          }),
        )
        progress.textContent = `${pad(opened.size)} / ${days.length} opened`
        reset.disabled = opened.size === 0
      }

      function open(index) {
        const day = days[index]
        if (!opened.has(index)) {
          opened.add(index)
          writeOpened(opened)
          render()
        }

        document.getElementById('entry-day').textContent = `day ${pad(index + 1)}`
        document.getElementById('entry-title').textContent = day.title
        document.getElementById('entry-thinker').textContent = day.thinker

        const [before, after] = day.body
        const quote = document.createElement('blockquote')
        const quoteText = document.createElement('p')
        quoteText.textContent = `“${day.quote}”`
        quote.append(quoteText, span('source', day.source))
        const paragraph = text => {
          const p = document.createElement('p')
          p.textContent = text
          return p
        }
        document
          .getElementById('entry-body')
          .replaceChildren(paragraph(before), quote, paragraph(after))

        dialog.dataset.index = String(index)
        dialog.showModal()
        dialog.scrollTop = 0
      }

      calendar.addEventListener('click', event => {
        const button = event.target.closest('.day')
        if (button) open(Number(button.dataset.index))
      })

      document.getElementById('close').addEventListener('click', () => dialog.close())

      // Return focus to the day that opened the entry; render() may have replaced it.
      dialog.addEventListener('close', () => {
        calendar.querySelector(`.day[data-index="${dialog.dataset.index}"]`)?.focus()
      })

      // A click on the backdrop lands on the dialog element itself.
      dialog.addEventListener('click', event => {
        if (event.target === dialog) dialog.close()
      })

      reset.addEventListener('click', () => {
        opened.clear()
        writeOpened(opened)
        render()
        calendar.querySelector('.day')?.focus()
      })

      render()
    </script>
  </body>
</html>
